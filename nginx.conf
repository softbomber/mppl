user www-data;
worker_processes auto;
pid /run/nginx.pid;

env REDIS_PASSWORD;

events {
    worker_connections 768;
}
http {
    lua_package_path "/usr/local/openresty/lualib/?.lua;/usr/local/share/lua/5.1/?.lua;;";
    lua_package_cpath "/usr/local/openresty/lualib/?.so;/usr/local/share/lua/5.1/?.so;;";
    lua_shared_dict state_cache 10m;
    lua_shared_dict auth_cache 20m;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log info;
    log_format dump_headers '[$time_local] IP: $remote_addr | URI: $request_uri | HEADERS: $all_req_headers';
    gzip on;
    lua_socket_log_errors off;
    server {
        listen 8123;
        listen [::]:8123;
        server_name _;
        keepalive_timeout 650;
        add_header Keep-Alive "timeout=650";
        location ~ ^/(\d+)/index\.m3u8$ {
            set $channel $1;
            set_by_lua_block $all_req_headers {
                local cjson = require "cjson"
                return cjson.encode(ngx.req.get_headers())
            }
            access_log /var/log/nginx/master_playlist_headers.log dump_headers;
            content_by_lua_file /etc/openresty/lua/hls.lua;
        }
    }
    init_worker_by_lua_block {
        local redis = require "resty.redis"
        local cjson = require "cjson"
        local subscribe_running = false

        local function log(level, msg)
            ngx.log(ngx[level] or ngx.INFO, msg)
        end

        -- =========================================================================
        -- REDIS
        -- =========================================================================
        local REDIS_PASSWORD = os.getenv("REDIS_PASSWORD") or "changeme"

        local function get_redis_conn()
            local red = redis:new()
            red:set_timeout(1000)
            local ok, err = red:connect("127.0.0.1", 6379)
            if not ok then return nil, err end
            local res, err = red:auth(REDIS_PASSWORD)
            if not res then
                red:close()
                return nil, "Auth failed: " .. tostring(err)
            end
            return red
        end

        -- =========================================================================
        -- ФАЙЛЫ / СИНХРОНИЗАЦИЯ КОНФИГОВ
        -- =========================================================================
        local function read_file(path)
            local f, err = io.open(path, "r")
            if not f then return nil, err end
            local content = f:read("*a")
            f:close()
            return content
        end

        local function sync_credentials(red, force)
            local file_path = "/etc/credentials.json"
            local content, err = read_file(file_path)
            if not content then return end
            local ver_key = "config:credentials_raw_ver"
            local stored_ver = red:get(ver_key)
            local has_data = red:exists("config:providers")
            if not force and (has_data == 1) and (stored_ver ~= ngx.null and stored_ver == content) then
                return
            end
            local ok, data = pcall(cjson.decode, content)
            if not ok then
                log("ERR", "[Credentials] JSON Decode Error")
                return
            end
            red:del("config:providers")
            local count = 0
            for ch, cfg in pairs(data) do
                red:hset("config:providers", ch, cjson.encode(cfg))
                count = count + 1
            end
            red:set(ver_key, content)
            log("INFO", string.format("[Credentials] Updated! Providers: %d", count))
        end

        local function sync_cdn_config(red, force)
            local file_path = "/etc/cdn_config.json"
            local redis_key = "config:cdn_json"
            local content, err = read_file(file_path)
            if not content then return end
            local ok, _ = pcall(cjson.decode, content)
            if not ok then
                log("ERR", "[CDN Config] Invalid JSON in file, skipping update.")
                return
            end
            local current_redis, err = red:get(redis_key)
            if err then return end
            if force or (current_redis == ngx.null) or (current_redis ~= content) then
                local ok2, err2 = red:set(redis_key, content)
                if ok2 then
                    log("INFO", "[CDN Config] Updated in Redis from file successfully.")
                end
            end
        end

        local function load_chanmap()
            local red, err = get_redis_conn()
            if not red then return end
            local content = read_file("/etc/chanmap.json")
            if content then
                local ok, data = pcall(cjson.decode, content)
                if ok then
                    red:del("config:chanmap")
                    for ch, cfg in pairs(data) do
                        red:hset("config:chanmap", ch, cjson.encode(cfg))
                    end
                    log("INFO", "Chanmap loaded into Redis")
                end
            end
            red:set_keepalive(10000, 50)
        end

        -- =========================================================================
        -- ОБРАБОТКА STOP-СООБЩЕНИЯ
        -- Правила:
        --   1. Данные для декремента — всегда из msg.* (C++ освобождает свой слот)
        --   2. Лок снимается в одном месте, линейно, после всей логики
        --   3. При активном архиве — только is_live=false, без декремента
        --   4. При STALE — аллокацию в Redis не трогаем, но декремент делаем
        --   5. Нет goto, нет ранних del(lock_key) внутри условий
        -- =========================================================================
        local function process_message(msg)
            ngx.log(ngx.ERR, "========== [STOP] process_message ENTER ==========")
            ngx.log(ngx.ERR, "[STOP] channel=", tostring(msg.channel),
                    " provider=", tostring(msg.provider),
                    " slot=", tostring(msg.slot),
                    " request_id=", tostring(msg.request_id))

            -- ШАГ 1: базовая валидация
            local channel = tostring(msg.channel or "")
            local request_id = msg.request_id

            if channel == "" then
                log("ERR", "[Stop] Message received without channel ID!")
                return
            end

            -- ШАГ 2: подключение к Redis
            local red, err = get_redis_conn()
            if not red then
                log("ERR", "[Stop] Cannot connect to Redis: " .. tostring(err))
                return
            end

            -- ШАГ 3: читаем аллокацию
            -- После hot switch ключ в channel_allocations может отличаться от channel в STOP-сообщении.
            -- Пример: канал 2415 → hot switch → 200 → 133. Ключ в Redis: "133", root_id: "2415".
            -- C++ шлёт STOP с channel=2415. Ищем сначала напрямую, потом по root_id.
            local alloc_key = channel  -- ключ в channel_allocations (может измениться)
            local alloc_json = red:hget("channel_allocations", channel)
            ngx.log(ngx.ERR, "[STOP] Redis alloc for channel=", channel, " raw=", tostring(alloc_json))

            -- Если не найдена напрямую — ищем по root_id (после hot switch ключ мог измениться)
            if not alloc_json or alloc_json == ngx.null then
                local all_allocs = red:hgetall("channel_allocations")
                if all_allocs then
                    for i = 1, #all_allocs, 2 do
                        local key = all_allocs[i]
                        local json = all_allocs[i + 1]
                        if json then
                            local ok, data = pcall(cjson.decode, json)
                            if ok and data and tostring(data.root_id) == channel then
                                alloc_key = key
                                alloc_json = json
                                ngx.log(ngx.ERR, "[STOP] Found allocation via root_id: stop_channel=", channel,
                                       " actual_key=", alloc_key, " root_id=", tostring(data.root_id))
                                break
                            end
                        end
                    end
                end
            end

            if not alloc_json or alloc_json == ngx.null then
                -- Канал уже остановлен или никогда не был запущен.
                -- Декрементить нечего — данных о слоте нет.
                log("WARN", "[Stop] Channel " .. channel .. " not found in allocations (already stopped).")
                if request_id then
                    red:publish("channel_stops_ack_" .. request_id,
                        cjson.encode({ request_id = request_id, status = "already_stopped" }))
                end
                red:set_keepalive(10000, 50)
                ngx.log(ngx.ERR, "[STOP] EXIT: already_stopped, channel=", channel)
                return
            end

            local ok_decode, alloc_data = pcall(cjson.decode, alloc_json)
            if not ok_decode or not alloc_data then
                log("ERR", "[Stop] Failed to decode alloc JSON for channel=" .. channel)
                red:set_keepalive(10000, 50)
                return
            end

            -- Данные для декремента берём из msg.* (что C++ реально использовал).
            -- Если msg не содержит provider/slot — fallback на данные из Redis.
            local dec_provider = msg.provider or alloc_data.provider
            local dec_slot     = tonumber(msg.slot ~= nil and msg.slot or alloc_data.slot)

            log("INFO", string.format("[Stop] Processing: channel=%s provider=%s slot=%s",
                channel, tostring(dec_provider), tostring(dec_slot)))

            -- ШАГ 4: проверка архива
            -- Если archive_last_seen существует — пользователь смотрит архив.
            -- Live закончился, но провайдерский слот ещё занят архивом.
            -- Только помечаем is_live=false. Декремент НЕ делаем.
            local archive_last_seen = red:get("archive_last_seen:" .. alloc_key)
            local archive_active = (archive_last_seen ~= nil and archive_last_seen ~= ngx.null)

            ngx.log(ngx.ERR, "[STOP] archive check: channel=", channel,
                    " archive_last_seen=", tostring(archive_last_seen),
                    " archive_active=", tostring(archive_active))

            if archive_active then
                log("INFO", "[Stop] Archive active, setting is_live=false only, channel=" .. channel)
                -- Перечитываем свежую аллокацию перед записью
                local fresh_json = red:hget("channel_allocations", alloc_key)
                if fresh_json and fresh_json ~= ngx.null then
                    local ok2, fresh_alloc = pcall(cjson.decode, fresh_json)
                    if ok2 and fresh_alloc then
                        fresh_alloc.is_live = false
                        if fresh_alloc.is_archive == nil then
                            fresh_alloc.is_archive = true
                        end
                        red:hset("channel_allocations", alloc_key, cjson.encode(fresh_alloc))
                        log("INFO", "[Stop] Updated: is_live=false for alloc_key=" .. alloc_key)
                    end
                end
                -- БЕЗ декремента — архив ещё использует слот
                red:set_keepalive(10000, 50)
                ngx.log(ngx.ERR, "[STOP] EXIT: archive_active, channel=", channel)
                return
            end

            -- ШАГ 5: захват лока (защита от гонки с cleanup-вотчером)
            local lock_key = "lock:cleanup:" .. alloc_key
            local lock_wait = 0
            while red:exists(lock_key) == 1 and lock_wait < 5 do
                ngx.sleep(0.1)
                lock_wait = lock_wait + 1
            end
            local lock_acquired = red:set(lock_key, "process_message", "EX", 5, "NX")

            local lock_failed = false
            if lock_acquired ~= "OK" then
                -- Лок не захвачен — аллокацию НЕ трогаем, но декремент сделаем.
                lock_failed = true
                log("WARN", "[Stop] Could not acquire lock for channel=" .. channel
                    .. ", skipping allocation delete but will still decrement.")
                ngx.log(ngx.ERR, "[STOP] lock_not_acquired, will still decrement, channel=", channel)
            end

            -- ШАГ 6: проверка STALE + принятие решения об удалении аллокации
            local should_delete = false
            local is_stale = false
            local skip_decrement = false

            if not lock_failed then
                -- Перечитываем аллокацию свежо (под локом)
                local current_alloc_json = red:hget("channel_allocations", alloc_key)

                if current_alloc_json and current_alloc_json ~= ngx.null then
                    local ok3, current_alloc = pcall(cjson.decode, current_alloc_json)
                    if ok3 and current_alloc then
                        local msg_slot = tonumber(msg.slot)
                        local db_slot  = tonumber(current_alloc.slot)
                        local msg_prov = msg.provider
                        local db_prov  = current_alloc.provider

                        local slot_mismatch = (msg_slot and db_slot and msg_slot ~= db_slot)
                        local prov_mismatch = (msg_prov and db_prov and msg_prov ~= db_prov)

                        if slot_mismatch or prov_mismatch then
                            -- STALE: в Redis уже новая аллокация (после failover).
                            -- Аллокацию НЕ трогаем — там уже новый провайдер.
                            is_stale = true
                            should_delete = false
                            -- Если failover уже декрементировал старый слот — пропускаем
                            if current_alloc.failover_old_slot_decremented then
                                skip_decrement = true
                                ngx.log(ngx.WARN, string.format(
                                    "[Stop] STALE MSG: msg=%s/slot%s db=%s/slot%s — old slot already decremented by failover",
                                    tostring(msg_prov), tostring(msg_slot),
                                    tostring(db_prov), tostring(db_slot)))
                            else
                                ngx.log(ngx.WARN, string.format(
                                    "[Stop] STALE MSG: msg=%s/slot%s db=%s/slot%s — keeping DB intact, decrementing old slot",
                                    tostring(msg_prov), tostring(msg_slot),
                                    tostring(db_prov), tostring(db_slot)))
                            end
                        else
                            -- Актуальное сообщение — слоты совпали.
                            current_alloc.is_live = false
                            current_alloc.is_archive = false
                            should_delete = true
                            ngx.log(ngx.ERR, "[STOP] Marking allocation for deletion: alloc_key=", alloc_key)
                        end
                    end
                else
                    -- Аллокация исчезла пока мы захватывали лок (cleanup успел раньше)
                    should_delete = false
                    ngx.log(ngx.WARN, "[STOP] Allocation disappeared before lock was acquired: alloc_key=", alloc_key)
                end

                -- Удаляем аллокацию если нужно
                if should_delete then
                    ngx.log(ngx.ERR, "[STOP] DELETING channel_allocations: alloc_key=", alloc_key,
                            " (stop_channel=", channel, ")")
                    red:hdel("channel_allocations", alloc_key)
                end

                -- Снимаем лок
                red:del(lock_key)
            end

            -- ШАГ 7: декремент счётчика слота
            -- Выполняется ВСЕГДА (даже если лок не захвачен) — декремент безопасен без лока.
            -- Данные из msg.* — C++ освобождает именно тот слот что использовал.
            if skip_decrement then
                ngx.log(ngx.ERR, "[STOP] Skipping decrement: old slot already decremented by failover")
            elseif dec_provider and dec_provider ~= "direct_url" and dec_slot ~= nil then
                local usage_key = dec_provider .. ":usage"
                local final_slot = dec_slot

                local dec_script = [[
                    local key = KEYS[1]
                    local idx = tonumber(ARGV[1])
                    local current = redis.call('LINDEX', key, idx)
                    if not current then return {-1, "Index missing in Redis"} end
                    local val = tonumber(current) or 0
                    if val > 0 then
                        redis.call('LSET', key, idx, tostring(val - 1))
                        return {val - 1, "Decremented"}
                    end
                    return {0, "Already 0"}
                ]]

                ngx.log(ngx.ERR, "[STOP] Decrementing: key=", usage_key, " slot=", final_slot,
                        " is_stale=", tostring(is_stale))

                local res, eval_err = red:eval(dec_script, 1, usage_key, final_slot)
                if not res then
                    log("ERR", string.format("[Stop] REDIS CRITICAL ERROR: key=%s slot=%s err=%s",
                        usage_key, tostring(final_slot), tostring(eval_err)))
                elseif type(res) == "table" then
                    if res[1] == -1 then
                        log("WARN", string.format("[Stop] Decrement failed: slot %s missing in %s",
                            tostring(final_slot), usage_key))
                    else
                        log("INFO", string.format("[Stop] Decremented: %s slot=%s new_value=%s (%s)",
                            usage_key, tostring(final_slot), tostring(res[1]), tostring(res[2])))
                    end
                end
            elseif dec_provider == "direct_url" then
                log("INFO", "[Stop] direct_url provider, no slot decrement needed for channel=" .. channel)
            else
                log("WARN", string.format(
                    "[Stop] Cannot decrement: missing provider(%s) or slot(%s) for channel=%s",
                    tostring(dec_provider), tostring(dec_slot), channel))
            end

            -- ШАГ 8: ACK
            if request_id then
                red:publish("channel_stops_ack_" .. request_id,
                    cjson.encode({ request_id = request_id, status = "success" }))
            end

            red:set_keepalive(10000, 50)
            ngx.log(ngx.ERR, "========== [STOP] process_message EXIT NORMAL ==========")
        end

        -- =========================================================================
        -- SUBSCRIBE LOOP — слушаем channel_stops
        -- =========================================================================
        local function subscribe_loop(premature, retry_count)
            if premature then
                ngx.log(ngx.ERR, "[SUBSCRIBE] Premature exit")
                return
            end
            if subscribe_running then
                ngx.log(ngx.ERR, "[SUBSCRIBE] Already running, skipping. pid=", ngx.worker.pid())
                return
            end
            subscribe_running = true
            retry_count = retry_count or 0

            ngx.log(ngx.ERR, "[SUBSCRIBE] Starting. pid=", ngx.worker.pid(), " retry=", retry_count)

            local red = redis:new()
            red:set_timeouts(1000, 1000, 60000)

            local ok, err = red:connect("127.0.0.1", 6379)
            if not ok then
                ngx.log(ngx.ERR, "[SUBSCRIBE] Connection failed (retry=", retry_count, "): ", tostring(err))
                subscribe_running = false
                ngx.timer.at(math.min(10, 2 ^ retry_count), subscribe_loop, retry_count + 1)
                return
            end

            local auth_res, auth_err = red:auth(REDIS_PASSWORD)
            if not auth_res then
                ngx.log(ngx.ERR, "[SUBSCRIBE] Auth failed: ", tostring(auth_err))
                red:close()
                subscribe_running = false
                ngx.timer.at(math.min(10, 2 ^ retry_count), subscribe_loop, retry_count + 1)
                return
            end

            local sub_ok, sub_err = red:subscribe("channel_stops")
            if not sub_ok then
                ngx.log(ngx.ERR, "[SUBSCRIBE] Subscribe failed: ", tostring(sub_err))
                red:close()
                subscribe_running = false
                ngx.timer.at(1, subscribe_loop, retry_count + 1)
                return
            end

            ngx.log(ngx.ERR, "[SUBSCRIBE] Successfully subscribed to channel_stops. pid=", ngx.worker.pid())

            while not ngx.worker.exiting() do
                local res, err = red:read_reply()
                if not res then
                    if err == "timeout" then
                        -- нормально, продолжаем
                    else
                        ngx.log(ngx.ERR, "[SUBSCRIBE] Read error, reconnecting: ", tostring(err))
                        red:close()
                        subscribe_running = false
                        ngx.timer.at(1, subscribe_loop, 0)
                        return
                    end
                elseif type(res) == "table" and res[1] == "message" then
                    local payload = res[3]
                    ngx.log(ngx.ERR, "[SUBSCRIBE] *** RAW MESSAGE ***: ", tostring(payload))
                    local ok_json, decoded = pcall(cjson.decode, payload)
                    if ok_json then
                        ngx.log(ngx.ERR, "[SUBSCRIBE] *** JSON OK, calling process_message ***")
                        local status, proc_err = pcall(function()
                            process_message(decoded)
                        end)
                        ngx.log(ngx.ERR, "[SUBSCRIBE] *** process_message done: status=",
                                tostring(status), " err=", tostring(proc_err))
                        if not status then
                            ngx.log(ngx.ERR, "[SUBSCRIBE] Process error: ", tostring(proc_err))
                        end
                    else
                        ngx.log(ngx.ERR, "[SUBSCRIBE] JSON Decode error: ", tostring(payload))
                    end
                end
            end

            ngx.log(ngx.ERR, "[SUBSCRIBE] Worker exiting, closing connection")
            red:close()
        end

        -- =========================================================================
        -- FAILOVER: выделение нового слота
        -- =========================================================================
        local function allocate_failover_slot(red, channel)
            local chanmap_json = red:hgetall("config:chanmap")
            local chanmap = {}
            if chanmap_json then
                for i = 1, #chanmap_json, 2 do
                    local ok, info = pcall(cjson.decode, chanmap_json[i + 1])
                    if ok and info then chanmap[chanmap_json[i]] = info end
                end
            end
            local channel_info = chanmap[channel]

            -- direct_url канал
            if channel_info and channel_info.url then
                local cdn_config_json = red:get("config:cdn_json")
                local cdn_ip = nil
                if cdn_config_json and cdn_config_json ~= ngx.null then
                    local ok, cdn_cfg = pcall(cjson.decode, cdn_config_json)
                    if ok then
                        local pool = {}
                        for ip, cfg in pairs(cdn_cfg) do
                            if cfg.active then
                                local updated = red:hget("cdn_stats:" .. ip, "updated")
                                if updated and updated ~= ngx.null then
                                    local w = tonumber(cfg.weight) or 1
                                    for j = 1, math.max(1, w) do table.insert(pool, ip) end
                                end
                            end
                        end
                        if #pool > 0 then
                            math.randomseed(ngx.now() * 10000 + ngx.worker.pid())
                            cdn_ip = pool[math.random(1, #pool)]
                        end
                    end
                end
                if not cdn_ip then return nil end
                local alloc = {
                    provider = "direct_url", slot = 0, allocated_at = ngx.time(),
                    cdn_ip = cdn_ip, source_url = channel_info.url,
                    quality = channel_info.quality, bandwidth = channel_info.bandwidth
                }
                return "direct_url", 0, cdn_ip, alloc
            end

            local providers_json = red:hgetall("config:providers")
            local providers = {}
            if providers_json then
                for i = 1, #providers_json, 2 do
                    local ok, cfg = pcall(cjson.decode, providers_json[i + 1])
                    if ok and cfg then
                        table.insert(providers, {
                            name = providers_json[i],
                            allow = cfg.allow_channels or 1,
                            priority = cfg.priority or 999,
                            cfg = cfg
                        })
                    end
                end
            end
            table.sort(providers, function(a, b) return a.priority < b.priority end)

            local acquire_script = [[
                local key = KEYS[1]
                local idx = tonumber(ARGV[1])
                local limit = tonumber(ARGV[2])
                local current = tonumber(redis.call('LINDEX', key, idx) or '0')
                if current >= limit then return {0, 'slot_full'} end
                redis.call('LSET', key, idx, current + 1)
                return {1, 'ok'}
            ]]

            local rollback_script = [[
                local key = KEYS[1]
                local idx = tonumber(ARGV[1])
                local c = tonumber(redis.call('LINDEX', key, idx) or '0')
                if c > 0 then redis.call('LSET', key, idx, c - 1) end
                return 1
            ]]

            for _, provider in ipairs(providers) do
                local usage_key = provider.name .. ":usage"
                local len = red:llen(usage_key)
                if len and len > 0 then
                    for i = 0, len - 1 do
                        local res = red:eval(acquire_script, 1, usage_key, i, provider.allow)
                        if type(res) == "table" and res[1] == 1 then
                            local items = provider.cfg.tokens or provider.cfg.bases or {}
                            local item = items[i + 1]
                            local base_url = type(item) == "table" and item.url or item
                            local allowed_cdns = (type(item) == "table" and item.allowed_cdns) or {}

                            if not base_url then
                                red:eval(rollback_script, 1, usage_key, i)
                                goto next_failover_slot
                            end

                            -- Сохраняем raw token ДО нормализации (для elbrus)
                            local raw_token = base_url
                            if not base_url:match("^https?://") then base_url = "http://" .. base_url end
                            base_url = base_url:gsub("/$", "")

                            local source_url
                            if provider.name == "admuspeh" then
                                local ch_id = channel_info and (channel_info.admuspeh or channel_info.id)
                                source_url = "http://cdn.admuspeh.my/" .. (ch_id or "0") .. "/video.m3u8?token=" .. base_url
                            elseif provider.name == "tvclub" then
                                local nb = base_url
                                source_url = (nb:match("/iptv/") and nb or nb .. "/iptv") .. "/" .. channel .. "/index.m3u8"
                            elseif provider.name == "elbrus" then
                                local elbrus_path = channel_info and channel_info.elbrus
                                local origin = provider.cfg.origin or "https://cdn.balelbrus.com"
                                -- origin может содержать протокол (http/https) или быть голым доменом/IP
                                local origin_with_scheme = origin
                                if not origin:match("^https?://") then
                                    origin_with_scheme = "http://" .. origin
                                end
                                origin_with_scheme = origin_with_scheme:gsub("/$", "")
                                if elbrus_path and elbrus_path ~= "" then
                                    elbrus_path = elbrus_path:gsub("^/+", ""):gsub("/+$", "")
                                    source_url = string.format("%s/%s/index.m3u8?token=%s",
                                        origin_with_scheme, elbrus_path, raw_token)
                                end
                            else
                                source_url = base_url .. "/" .. channel .. "/index.m3u8"
                            end

                            if not source_url then
                                red:eval(rollback_script, 1, usage_key, i)
                                goto next_failover_slot
                            end

                            -- Валидация URL: если origin невалидный — НЕ выделяем слот
                            local fo_host = source_url:match("^https?://([^/:]+)")
                            if not fo_host or fo_host:match("[^%w%.%-]") or not fo_host:match("%.") then
                                ngx.log(ngx.ERR, "[FAILOVER_SKIP] Invalid source_url for provider=",
                                        provider.name, " url=", source_url,
                                        " — check origin in credentials (non-ASCII chars?)")
                                red:eval(rollback_script, 1, usage_key, i)
                                goto next_failover_slot
                            end

                            local cdn_ip = nil
                            local cdn_config_json = red:get("config:cdn_json")
                            if cdn_config_json and cdn_config_json ~= ngx.null then
                                local ok, cdn_cfg = pcall(cjson.decode, cdn_config_json)
                                if ok then
                                    local avail = {}
                                    for ip, cfg in pairs(cdn_cfg) do
                                        if cfg.active then
                                            if #allowed_cdns == 0 then
                                                table.insert(avail, ip)
                                            else
                                                for _, a_ip in ipairs(allowed_cdns) do
                                                    if ip == a_ip then
                                                        table.insert(avail, ip)
                                                        break
                                                    end
                                                end
                                            end
                                        end
                                    end
                                    local pool = {}
                                    for _, ip in ipairs(avail) do
                                        local updated = red:hget("cdn_stats:" .. ip, "updated")
                                        if updated and updated ~= ngx.null then
                                            local w = tonumber((cdn_cfg[ip] or {}).weight) or 1
                                            for j = 1, math.max(1, w) do table.insert(pool, ip) end
                                        end
                                    end
                                    if #pool > 0 then
                                        math.randomseed(ngx.now() * 10000 + ngx.worker.pid())
                                        cdn_ip = pool[math.random(1, #pool)]
                                    elseif #avail > 0 then
                                        cdn_ip = avail[1]
                                    end
                                end
                            end

                            if not cdn_ip then
                                red:eval(rollback_script, 1, usage_key, i)
                                goto next_failover_slot
                            end

                            local alloc = {
                                provider = provider.name,
                                slot = i,
                                allocated_at = ngx.time(),
                                cdn_ip = cdn_ip,
                                source_url = source_url,
                                token = (type(item) == "table" and item.url or item)
                            }
                            ngx.log(ngx.ERR, "[FAILOVER_ALLOC] ALLOCATED: channel=", channel,
                                    " provider=", provider.name, " slot=", i, " cdn=", cdn_ip)
                            return provider.name, i, cdn_ip, alloc
                        end
                        ::next_failover_slot::
                    end
                end
            end
            return nil, nil, nil, nil
        end

        -- =========================================================================
        -- CHANNEL CONTROL SUBSCRIBER — слушаем REQUEST_FAILOVER
        -- При успешном failover: декрементируем старый слот сразу (C++ переключится
        -- на новый и не пришлёт STOP для старого).
        -- =========================================================================
        local function start_channel_control_subscriber(premature)
            if premature then return end
            ngx.log(ngx.ERR, "[CHANNEL_CONTROL] Starting subscriber. pid=", ngx.worker.pid())

            local red = redis:new()
            red:set_timeouts(1000, 1000, 60000)

            local ok, err = red:connect("127.0.0.1", 6379)
            if not ok then
                ngx.log(ngx.ERR, "[CHANNEL_CONTROL] Connection failed, retry in 2s: ", tostring(err))
                ngx.timer.at(2, start_channel_control_subscriber)
                return
            end

            local auth_res, auth_err = red:auth(REDIS_PASSWORD)
            if not auth_res then
                ngx.log(ngx.ERR, "[CHANNEL_CONTROL] Auth failed: ", tostring(auth_err))
                red:close()
                ngx.timer.at(2, start_channel_control_subscriber)
                return
            end

            local sub_ok, sub_err = red:subscribe("channel_control")
            if not sub_ok then
                ngx.log(ngx.ERR, "[CHANNEL_CONTROL] Subscribe failed, retry in 2s: ", tostring(sub_err))
                red:close()
                ngx.timer.at(2, start_channel_control_subscriber)
                return
            end

            ngx.log(ngx.ERR, "[CHANNEL_CONTROL] Successfully subscribed. pid=", ngx.worker.pid())

            while not ngx.worker.exiting() do
                local res, err = red:read_reply()
                if not res then
                    if err == "timeout" then
                        -- нормально
                    else
                        ngx.log(ngx.ERR, "[CHANNEL_CONTROL] Read error, reconnecting: ", tostring(err))
                        red:close()
                        ngx.timer.at(2, start_channel_control_subscriber)
                        return
                    end
                elseif type(res) == "table" and res[1] == "message" then
                    local payload = res[3]
                    local ok_json, msg = pcall(cjson.decode, payload)
                    if ok_json and msg.action == "REQUEST_FAILOVER" then
                        ngx.log(ngx.ERR, "[FAILOVER] Received REQUEST_FAILOVER: channel=", msg.channel,
                                " reason=", msg.reason or "unknown")
                        local status, proc_err = pcall(function()
                            local red_work, conn_err = get_redis_conn()
                            if not red_work then
                                ngx.log(ngx.ERR, "[FAILOVER] Cannot connect to Redis: ", tostring(conn_err))
                                return
                            end
                            local channel = msg.channel
                            -- Выделяем новый слот
                            local prov, idx, cdn_ip, alloc = allocate_failover_slot(red_work, channel)
                            if prov and alloc and alloc.source_url then
                                alloc.is_live = true
                                alloc.is_archive = false
                                alloc.failover_from = msg.current_provider or "unknown"
                                alloc.allocated_at = ngx.time()
                                alloc.failover_old_slot_decremented = true
                                red_work:hset("channel_allocations", channel, cjson.encode(alloc))
                                local switch_msg = {
                                    action = "SWITCH",
                                    channel = channel,
                                    new_channel = channel,
                                    new_source_url = alloc.source_url,
                                    new_slot = alloc.slot,
                                    new_token = alloc.token or "",
                                    type = "FAILOVER",
                                    new_provider = alloc.provider
                                }
                                red_work:publish("channel_control", cjson.encode(switch_msg))

                                -- Декрементируем СТАРЫЙ слот сразу: C++ переключится
                                -- на новый и не пришлёт STOP для старого.
                                local old_prov = msg.current_provider
                                local old_slot = tonumber(msg.current_slot)
                                if old_prov and old_prov ~= "direct_url" and old_slot ~= nil then
                                    local old_usage_key = old_prov .. ":usage"
                                    local dec_script = [[
                                        local key = KEYS[1]
                                        local idx = tonumber(ARGV[1])
                                        local current = redis.call('LINDEX', key, idx)
                                        if not current then return {-1, "missing"} end
                                        local val = tonumber(current) or 0
                                        if val > 0 then
                                            redis.call('LSET', key, idx, tostring(val - 1))
                                            return {val - 1, "ok"}
                                        end
                                        return {0, "already_zero"}
                                    ]]
                                    local dec_res, dec_err = red_work:eval(dec_script, 1, old_usage_key, old_slot)
                                    if dec_res and type(dec_res) == "table" then
                                        ngx.log(ngx.ERR, "[FAILOVER] OLD SLOT DECREMENTED: ",
                                                old_usage_key, " slot=", old_slot,
                                                " new_val=", tostring(dec_res[1]))
                                    else
                                        ngx.log(ngx.ERR, "[FAILOVER] OLD SLOT DECREMENT FAILED: ",
                                                old_usage_key, " slot=", old_slot,
                                                " err=", tostring(dec_err))
                                    end
                                end

                                ngx.log(ngx.ERR, "[FAILOVER] SUCCESS: channel=", channel,
                                        " provider=", prov, " slot=", idx,
                                        " cdn=", cdn_ip, " url=", alloc.source_url)
                            else
                                ngx.log(ngx.ERR, "[FAILOVER] FAILED: no available slots for channel=", channel)
                            end
                            red_work:set_keepalive(10000, 50)
                        end)
                        if not status then
                            ngx.log(ngx.ERR, "[FAILOVER] Processing error: ", tostring(proc_err))
                        end
                    end
                end
            end
            red:close()
        end

        -- =========================================================================
        -- CONFIG WATCHER + CLEANUP
        -- Вотчер очищает аллокации у которых is_live=false И is_archive=false.
        -- НЕТ heartbeat-cleanup и dying-cleanup — они конфликтовали с STOP handler.
        -- =========================================================================
        local function config_watcher_loop(premature)
            if premature then return end
            local status, err = pcall(function()
                ngx.log(ngx.INFO, "[WATCHER] Tick. pid=", ngx.worker.pid())
                local red, conn_err = get_redis_conn()
                if not red then
                    error("Watcher redis fail: " .. tostring(conn_err))
                end
                sync_credentials(red, false)
                sync_cdn_config(red, false)

                local function cleanup_expired_archives(red)
                    local all_channels = red:hkeys("channel_allocations")
                    if not all_channels or #all_channels == 0 then return end

                    ngx.log(ngx.INFO, string.format("[CLEANUP] START: channels=%d pid=%d",
                        #all_channels, ngx.worker.pid()))
                    local freed_count = 0

                    for _, channel in ipairs(all_channels) do
                        local alloc_json = red:hget("channel_allocations", channel)
                        if not alloc_json or alloc_json == ngx.null then
                            goto next_channel
                        end

                        local ok_dec, alloc = pcall(cjson.decode, alloc_json)
                        if not ok_dec or not alloc then
                            goto next_channel
                        end

                        local is_live    = alloc.is_live
                        local is_archive = alloc.is_archive

                        -- Флаги не выставлены — аллокация создана старым кодом,
                        -- не трогаем её во избежание ложных удалений.
                        if is_live == nil or is_archive == nil then
                            ngx.log(ngx.INFO, string.format("[CLEANUP] SKIP (no flags): channel=%s", channel))
                            goto next_channel
                        end

                        -- Сбрасываем is_archive если архив уже неактивен
                        local archive_last_seen = red:get("archive_last_seen:" .. channel)
                        local archive_active = (archive_last_seen ~= nil and archive_last_seen ~= ngx.null)
                        if not archive_active and is_archive then
                            alloc.is_archive = false
                            red:hset("channel_allocations", channel, cjson.encode(alloc))
                            ngx.log(ngx.INFO, string.format("[CLEANUP] Reset is_archive: channel=%s", channel))
                            is_archive = false
                        end

                        -- Удаляем только если оба флага false
                        if not is_live and not is_archive then
                            ngx.log(ngx.WARN, string.format(
                                "[CLEANUP] WILL DELETE: channel=%s is_live=false is_archive=false pid=%d",
                                channel, ngx.worker.pid()))

                            local lock_key = "lock:cleanup:" .. channel
                            local lock_acquired = red:set(lock_key, "cleanup", "EX", 5, "NX")
                            if lock_acquired ~= "OK" then
                                ngx.log(ngx.INFO, string.format(
                                    "[CLEANUP] Locked by another process: channel=%s", channel))
                                goto next_channel
                            end

                            -- Свежая проверка под локом
                            local fresh_json = red:hget("channel_allocations", channel)
                            if fresh_json and fresh_json ~= ngx.null then
                                local ok2, fresh = pcall(cjson.decode, fresh_json)
                                if ok2 and fresh and fresh.is_live == false and fresh.is_archive == false then
                                    -- Декремент live-слота
                                    if fresh.provider and fresh.provider ~= "direct_url" and fresh.slot ~= nil then
                                        local usage_key = fresh.provider .. ":usage"
                                        local cur = tonumber(red:lindex(usage_key, fresh.slot)) or 0
                                        if cur > 0 then
                                            red:lset(usage_key, fresh.slot, tostring(cur - 1))
                                            ngx.log(ngx.INFO, string.format(
                                                "[CLEANUP] Freed slot: channel=%s provider=%s slot=%s usage=%d",
                                                channel, fresh.provider, fresh.slot, cur - 1))
                                            freed_count = freed_count + 1
                                        end
                                    end
                                    -- Декремент архивного слота (если был)
                                    local arc_json = red:hget("archive_tvclub_url", channel)
                                    if arc_json and arc_json ~= ngx.null then
                                        local ok3, arc = pcall(cjson.decode, arc_json)
                                        if ok3 and arc and arc.provider ~= "direct_url" and arc.slot ~= nil then
                                            local arc_key = arc.provider .. ":usage"
                                            local arc_cur = tonumber(red:lindex(arc_key, arc.slot)) or 0
                                            if arc_cur > 0 then
                                                red:lset(arc_key, arc.slot, tostring(arc_cur - 1))
                                                ngx.log(ngx.INFO, string.format(
                                                    "[CLEANUP] Freed archive slot: channel=%s provider=%s slot=%s usage=%d",
                                                    channel, arc.provider, arc.slot, arc_cur - 1))
                                            end
                                        end
                                    end
                                    red:hdel("channel_allocations", channel)
                                    red:hdel("archive_tvclub_url", channel)
                                    ngx.log(ngx.ERR, string.format(
                                        "[CLEANUP] DELETED: channel=%s pid=%d", channel, ngx.worker.pid()))
                                end
                            end
                            red:del(lock_key)
                        else
                            ngx.log(ngx.INFO, string.format(
                                "[CLEANUP] SKIP: channel=%s is_live=%s is_archive=%s",
                                channel, tostring(is_live), tostring(is_archive)))
                        end

                        ::next_channel::
                    end

                    ngx.log(ngx.INFO, string.format("[CLEANUP] END: freed=%d", freed_count))
                end

                cleanup_expired_archives(red)
                red:set_keepalive(10000, 50)
            end)
            if not status then
                ngx.log(ngx.ERR, "[WATCHER] CRASHED: " .. tostring(err))
            end
            ngx.timer.at(5, config_watcher_loop)
        end

        -- =========================================================================
        -- СТАРТ: только воркер 0
        -- =========================================================================
        if ngx.worker.id() == 0 then
            ngx.log(ngx.ERR, "[INIT] Worker 0 starting. pid=", ngx.worker.pid())

            ngx.timer.at(0, function()
                ngx.log(ngx.ERR, "[TIMER-0] FIRED: sync + subscribe_loop")
                pcall(load_chanmap)
                pcall(function()
                    local red, err = get_redis_conn()
                    if red then
                        sync_credentials(red, true)
                        sync_cdn_config(red, true)
                        red:set_keepalive(10000, 50)
                    end
                end)
                ngx.log(ngx.ERR, "[TIMER-0] Calling subscribe_loop NOW")
                subscribe_loop(nil, 0)
                -- Если subscribe_loop вернулся — значит упал, логируем
                ngx.log(ngx.ERR, "[TIMER-0] subscribe_loop RETURNED (unexpected!)")
            end)

            ngx.timer.at(1, function(premature)
                ngx.log(ngx.ERR, "[TIMER-1] config_watcher_loop FIRED")
                config_watcher_loop(premature)
            end)

            ngx.timer.at(2, function(premature)
                ngx.log(ngx.ERR, "[TIMER-2] start_channel_control_subscriber FIRED")
                start_channel_control_subscriber(premature)
            end)

            ngx.log(ngx.ERR, "[INIT] All 3 timers registered. pid=", ngx.worker.pid())
        end
    }
    include /etc/nginx/sites-enabled/*;
}
