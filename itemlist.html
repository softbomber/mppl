<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Список подписок</title>
    <style>
        .selected {
            background-color: #14532d;
            position: relative;
        }
        .checkmark {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: white;
            color: #16a34a;
            padding: 2px 6px;
            border-radius: 5px;
            font-size: 12px;
            display: none;
        }
    </style>
</head>
<body class="bg-gray-900 flex justify-center items-center h-screen">
    <div id="subscription" class="bg-gray-800 shadow-lg rounded-lg p-5 w-96 border border-gray-700 cursor-pointer relative text-white">
        <div class="flex items-center mb-4">
            <div class="bg-gray-700 rounded-lg p-2">
                <img src="/logos/telekarta.png" alt="Лого" class="w-12 h-12 rounded-lg">
            </div>
        </div>
        <span class="checkmark">✔</span>
        <div class="text-sm font-semibold text-gray-300">
            <span>Название пакета:</span>
            <div class="text-green-400 font-medium mt-1">Телекарта [80E]</div>
        </div>
        <p class="text-xs text-gray-400 mt-2">Дата активации: <span class="font-medium">28.02.2025</span></p>
        <p class="text-xs text-gray-400">Окончание подписки: <span class="font-medium">29.03.2025</span></p>
        
        <div class="mt-3">
            <label for="months" class="block text-xs font-medium text-gray-400">Выберите количество месяцев:</label>
            <div class="relative mt-1">
                <select id="months" class="w-full appearance-none bg-gray-700 border border-gray-600 text-gray-300 py-2 px-3 pr-8 rounded leading-tight focus:outline-none focus:ring-2 focus:ring-green-400 text-xs">
                    <option value="1">1 месяц</option>
                    <option value="3">3 месяца</option>
                    <option value="6">6 месяцев</option>
                    <option value="12">12 месяцев</option>
                </select>
                <div class="absolute inset-y-0 right-0 flex items-center px-2 pointer-events-none">
                    <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </div>
            </div>
        </div>
        
        <button class="mt-3 w-full bg-green-500 hover:bg-green-600 text-white font-semibold py-2 rounded-lg text-xs">
            Стоп
        </button>
    </div>

    <script>
        document.getElementById('subscription').addEventListener('click', function(event) {
            if (event.target.tagName.toLowerCase() === 'select' || event.target.tagName.toLowerCase() === 'button') {
                return;
            }
            this.classList.toggle('selected');
            let checkmark = this.querySelector('.checkmark');
            checkmark.style.display = this.classList.contains('selected') ? 'block' : 'none';
        });
    </script>
</body>
</html>
